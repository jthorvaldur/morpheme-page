<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROWSE — Word Decomposition Dictionary</title>
<link rel="stylesheet" href="css/global.css">
<style>
  /* ---- Search bar ---- */
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 0.8rem;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.85rem;
    padding: 14px 20px 14px 44px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color .25s;
  }

  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--text-faint); font-size: 0.78rem; }

  /* ---- Filter bar ---- */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    align-items: center;
  }

  .filter-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-right: 4px;
  }

  /* ---- Sort / stats row ---- */
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .stats-line {
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .stats-line strong { color: var(--gold); }

  .sort-group {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .sort-label {
    font-size: 0.55rem;
    letter-spacing: 1px;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-right: 6px;
  }

  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.55rem;
    letter-spacing: 1px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .2s;
  }

  .sort-btn:hover { color: var(--text); border-color: #333; }
  .sort-btn.active { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }

  /* ---- Card grid ---- */
  .word-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .word-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
  }

  .word-card:hover {
    border-color: #2a2a2a;
    background: var(--bg-card-hover);
  }

  .word-card.expanded {
    border-color: rgba(192,160,96,0.3);
  }

  .word-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .word-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .word-badges {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .word-formula {
    flex: 1;
    text-align: right;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    min-width: 200px;
  }

  .word-formula .pf { color: #cc8844; }
  .word-formula .rt { color: var(--gold); }
  .word-formula .sf { color: #4488cc; }
  .word-formula .arrow { color: var(--text-faint); margin: 0 2px; }

  .word-meaning-preview {
    margin-top: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .word-meaning-preview strong { color: var(--gold); font-weight: 600; }

  /* ---- Expanded details ---- */
  .word-details {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    animation: fadeIn .3s ease-out;
  }

  .word-card.expanded .word-details { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 6px 16px;
    font-size: 0.68rem;
  }

  .detail-grid .dlabel {
    color: var(--text-faint);
    letter-spacing: 1px;
    font-size: 0.58rem;
    text-transform: uppercase;
    text-align: right;
    padding-top: 2px;
  }

  .detail-grid .dvalue { color: var(--text-dim); line-height: 1.6; }
  .detail-grid .dvalue.struck { text-decoration: line-through; color: #666; }
  .detail-grid .dvalue.gold { color: var(--gold); }

  /* ---- Expand indicator ---- */
  .expand-arrow {
    position: absolute;
    right: 16px;
    top: 18px;
    font-size: 0.6rem;
    color: var(--text-faint);
    transition: transform .2s;
  }

  .word-card.expanded .expand-arrow { transform: rotate(180deg); }

  /* ---- Loading / empty states ---- */
  .state-msg {
    text-align: center;
    padding: 60px 20px;
    font-size: 0.75rem;
    color: var(--text-faint);
    letter-spacing: 1px;
  }

  .state-msg .sub {
    font-size: 0.62rem;
    margin-top: 8px;
    color: var(--text-faint);
    opacity: 0.6;
  }

  .loading-pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }

  @media (max-width: 600px) {
    .word-formula { text-align: left; min-width: 0; }
    .detail-grid { grid-template-columns: 100px 1fr; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="container">
    <a href="index.html" class="nav-brand">MORPHEME</a>
    <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
    <ul class="nav-links">
      <li><a href="explore.html">Explore</a></li>
      <li><a href="browse.html" class="active">Browse</a></li>
      <li><a href="contribute.html">Contribute</a></li>
      <li><a href="ask.html">Ask</a></li>
    </ul>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title">BROWSE</h1>
  <p class="page-subtitle">WORD DECOMPOSITION DICTIONARY</p>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">/</span>
    <input type="text" class="search-input" id="searchInput"
           placeholder="Search decompositions..." autocomplete="off" spellcheck="false">
  </div>

  <!-- Filter chips -->
  <div class="filter-bar">
    <span class="filter-label">Filter</span>
    <span class="chip active" data-filter="all">All</span>
    <span class="chip" data-filter="legal">Legal</span>
    <span class="chip" data-filter="medical">Medical</span>
    <span class="chip" data-filter="financial">Financial</span>
    <span class="chip" data-filter="education">Education</span>
    <span class="chip" data-filter="religion">Religion</span>
    <span class="chip" data-filter="technology">Technology</span>
    <span class="chip" data-filter="psychology">Psychology</span>
    <span class="chip" data-filter="negated">Negated Only</span>
  </div>

  <!-- Controls row -->
  <div class="controls-row">
    <div class="stats-line" id="statsLine">Loading decompositions...</div>
    <div class="sort-group">
      <span class="sort-label">Sort</span>
      <button class="sort-btn active" data-sort="alpha">A-Z</button>
      <button class="sort-btn" data-sort="domain">Domain</button>
      <button class="sort-btn" data-sort="negated">Negated First</button>
    </div>
  </div>

  <!-- Word grid -->
  <div class="word-grid" id="wordGrid">
    <div class="state-msg loading-pulse" id="loadingMsg">Loading decompositions...</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  let allData = [];
  let activeFilter = 'all';
  let activeSort = 'alpha';
  let searchQuery = '';

  const grid = document.getElementById('wordGrid');
  const statsLine = document.getElementById('statsLine');
  const loadingMsg = document.getElementById('loadingMsg');
  const searchInput = document.getElementById('searchInput');

  // ---- Load data ----
  fetch('/data/decompositions.json')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      allData = data;
      render();
    })
    .catch(() => {
      loadingMsg.innerHTML = 'Loading decompositions...<div class="sub">Could not load /data/decompositions.json. If running locally, serve the project root with a static file server.</div>';
      loadingMsg.classList.remove('loading-pulse');
    });

  // ---- Filter chips ----
  document.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      render();
    });
  });

  // ---- Sort buttons ----
  document.querySelectorAll('.sort-btn[data-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeSort = btn.dataset.sort;
      render();
    });
  });

  // ---- Search ----
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  });

  // ---- Render ----
  function render() {
    let filtered = allData;

    // Filter
    if (activeFilter === 'negated') {
      filtered = filtered.filter(d => d.is_negated);
    } else if (activeFilter !== 'all') {
      filtered = filtered.filter(d => d.domain === activeFilter);
    }

    // Search
    if (searchQuery) {
      filtered = filtered.filter(d => {
        const hay = [
          d.word, d.prefix, d.prefix_meaning, d.root, d.root_meaning,
          d.suffix, d.suffix_meaning, d.true_meaning, d.apparent_meaning, d.domain
        ].join(' ').toLowerCase();
        return hay.includes(searchQuery);
      });
    }

    // Sort
    if (activeSort === 'alpha') {
      filtered.sort((a, b) => a.word.localeCompare(b.word));
    } else if (activeSort === 'domain') {
      filtered.sort((a, b) => a.domain.localeCompare(b.domain) || a.word.localeCompare(b.word));
    } else if (activeSort === 'negated') {
      filtered.sort((a, b) => (b.is_negated ? 1 : 0) - (a.is_negated ? 1 : 0) || a.word.localeCompare(b.word));
    }

    // Stats
    statsLine.innerHTML = 'Showing <strong>' + filtered.length + '</strong> of <strong>' + allData.length + '</strong> decompositions';

    // Build cards
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="state-msg">No decompositions match your search.</div>';
      return;
    }

    grid.innerHTML = filtered.map(d => buildCard(d)).join('');

    // Attach expand listeners
    grid.querySelectorAll('.word-card').forEach(card => {
      card.addEventListener('click', () => {
        card.classList.toggle('expanded');
      });
    });
  }

  function buildCard(d) {
    const esc = s => {
      const div = document.createElement('div');
      div.textContent = s || '';
      return div.innerHTML;
    };

    // Formula line: prefix -> meaning | root -> meaning | suffix -> meaning
    let formula = '';
    if (d.prefix) {
      formula += '<span class="pf">' + esc(d.prefix) + '</span><span class="arrow">&rarr;</span>' + esc(d.prefix_meaning);
    }
    if (d.prefix && d.root) formula += ' <span class="arrow">|</span> ';
    formula += '<span class="rt">' + esc(d.root) + '</span><span class="arrow">&rarr;</span>' + esc(d.root_meaning);
    if (d.suffix) {
      formula += ' <span class="arrow">|</span> <span class="sf">' + esc(d.suffix) + '</span><span class="arrow">&rarr;</span>' + esc(d.suffix_meaning);
    }

    // Badges
    let badges = '';
    if (d.is_negated) badges += '<span class="badge badge-negated">NEGATED</span>';
    badges += '<span class="badge badge-domain">' + esc(d.domain) + '</span>';

    // Expanded detail rows
    let details = '';
    if (d.prefix) {
      details += '<span class="dlabel">Prefix</span><span class="dvalue"><span style="color:#cc8844">' + esc(d.prefix) + '</span> &mdash; ' + esc(d.prefix_meaning) + '</span>';
    }
    details += '<span class="dlabel">Root</span><span class="dvalue"><span style="color:var(--gold)">' + esc(d.root) + '</span> &mdash; ' + esc(d.root_meaning) + '</span>';
    if (d.suffix) {
      details += '<span class="dlabel">Suffix</span><span class="dvalue"><span style="color:#4488cc">' + esc(d.suffix) + '</span> &mdash; ' + esc(d.suffix_meaning) + '</span>';
    }
    details += '<span class="dlabel">True Meaning</span><span class="dvalue gold">' + esc(d.true_meaning) + '</span>';
    details += '<span class="dlabel">Apparent Meaning</span><span class="dvalue struck">' + esc(d.apparent_meaning) + '</span>';
    if (d.is_negated) {
      details += '<span class="dlabel">VCC Negation</span><span class="dvalue" style="color:var(--red)">Active &mdash; vowel-consonant prefix inverts the root meaning</span>';
    }

    return '<div class="word-card">' +
      '<span class="expand-arrow">&#9660;</span>' +
      '<div class="word-card-header">' +
        '<span class="word-name">' + esc(d.word) + '</span>' +
        '<div class="word-badges">' + badges + '</div>' +
        '<div class="word-formula">' + formula + '</div>' +
      '</div>' +
      '<div class="word-meaning-preview"><strong>' + esc(d.true_meaning) + '</strong></div>' +
      '<div class="word-details"><div class="detail-grid">' + details + '</div></div>' +
    '</div>';
  }

})();
</script>
</body>
</html>
