<script>
// =========================================================================
// DECOMPOSITION ENGINE
// Three-tier word decomposition:
//   1. CURATED — hand-verified decompositions (decompositions.json)
//   2. BASIS   — 720 quantum grammar basis words (basis_720.json)
//   3. ENGINE  — algorithmic prefix/root/suffix parse
//
// The engine mirrors python/src/morpheme_negation.py — same dictionaries,
// same longest-match-first logic, same VCC negation rules.
// =========================================================================

// ---------------------------------------------------------------------------
// TIER 1: Curated decompositions — loaded from /data/decompositions.json
// These are hand-verified, gold-standard entries with full etymology.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

// Each entry has: word, role, jurisdiction, negated, complexity, root
// Used for root identification and jurisdiction assignment.
// ---------------------------------------------------------------------------

let BASIS_ROOTS = {};  // root -> {jurisdiction, role, words:[]}

// ---------------------------------------------------------------------------
// TIER 3: Algorithmic decomposition engine
// Ported from python/src/morpheme_negation.py
// ---------------------------------------------------------------------------

// --- PREFIXES ---
// Mirrors PREFIXES dict from morpheme_negation.py
const PREFIXES = {

// --- ROOTS ---
// Mirrors ROOTS dict from morpheme_negation.py (Latin/OE roots, 200+)
const ROOTS = {

  "arch":    "chief/rule/first",

// --- SUFFIXES ---
// Mirrors SUFFIXES dict from morpheme_negation.py
const SUFFIXES = {
  "tion":  "contract/action/process",
  "sion":  "contract/action/process",
  "ion":   "contract/action",
  "ment":  "mind/state/result of action",
  "ence":  "now-state/quality",
  "ance":  "now-state/quality",
  "ency":  "now-state/quality",
  "ancy":  "now-state/quality",
  "ity":   "quality/state",
  "ty":    "quality/state",
  "ness":  "state/condition",
  "ous":   "full of/having quality",
  "ious":  "full of/having quality",
  "eous":  "full of/having quality",
  "ive":   "tending to/having nature of",
  "ative": "tending to/relating to",
  "itive": "tending to/relating to",
  "able":  "capable of/worthy of",
  "ible":  "capable of/worthy of",
  "al":    "pertaining to/of the kind",
  "ial":   "pertaining to/of the kind",
  "ual":   "pertaining to/of the kind",
  "ing":   "now-time/living/present action",
  "ed":    "past/dead time/completed",
  "er":    "one who/that which",
  "or":    "one who/that which",
  "ar":    "one who/relating to",
  "ist":   "one who practices",
  "ant":   "one who/performing",
  "ent":   "one who/performing",
  "ate":   "to make/through/state",
  "ize":   "to make/to become",
  "ise":   "to make/to become",
  "fy":    "to make/to cause",
  "ify":   "to make/to cause",
  "en":    "to make/made of",
  "ure":   "act/process/result",
  "ture":  "act/process/result",
  "age":   "act/state/collection",
  "dom":   "domain/state/condition",
  "ship":  "state/office/vessel",
  "hood":  "state/condition/group",
  "ward":  "direction/toward",
  "wise":  "manner/direction",
  "ly":    "in the manner of",
  "ful":   "full of",
  "less":  "without",
  "ic":    "pertaining to/having nature of",
  "ical":  "pertaining to/having nature of",
  "ory":   "place of/serving for",
  "ary":   "relating to/place of",
  "ery":   "place of/art of/collection",
};

// --- VCC NEGATION PREFIXES ---
// The subset of prefixes that perform meaning-inversion.
// A word starting with one of these prefixes NEGATES its root.
const VCC_NEGATION_PREFIXES = {
  "in":  "no/not",
  "im":  "no/not",
  "il":  "no/not",
  "ir":  "no/not",
  "a":   "no/without",
  "an":  "no/without",
  "as":  "no/without",
  "ab":  "away from",
  "o":   "no/without",
  "ob":  "against",
  "un":  "not/reverse",
  "ex":  "out of",
  "e":   "out of",
};

// Sort keys by length descending for longest-match-first
const PREFIXES_SORTED = Object.keys(PREFIXES).sort((a,b) => b.length - a.length);
const SUFFIXES_SORTED = Object.keys(SUFFIXES).sort((a,b) => b.length - a.length);
const ROOTS_SORTED    = Object.keys(ROOTS).sort((a,b) => b.length - a.length);


// ---------------------------------------------------------------------------
// DECOMPOSITION FUNCTIONS
// ---------------------------------------------------------------------------

/**
 * Find the best prefix match in a word.
 * Returns { prefix, meaning, remainder } or null.
 * Longest match first to avoid false hits (e.g. "inter" before "in").
 */
function findPrefix(word) {
  for (const pfx of PREFIXES_SORTED) {
    if (word.startsWith(pfx) && word.length > pfx.length + 1) {
      const remainder = word.slice(pfx.length);
      if (remainder.length >= 2) {
        return { prefix: pfx, meaning: PREFIXES[pfx], remainder };
      }
    }
  }
  return null;
}

/**
 * Find the best suffix match in a word/stem.
 * Returns { stem, suffix, meaning } or { stem: word, suffix: "", meaning: "" }.
 * Longest match first.
 */
function findSuffix(word) {
  for (const sfx of SUFFIXES_SORTED) {
    if (word.endsWith(sfx) && word.length > sfx.length + 1) {
      return { stem: word.slice(0, -sfx.length), suffix: sfx, meaning: SUFFIXES[sfx] };
    }
  }
  return { stem: word, suffix: "", meaning: "" };
}

/**
 * Find the best root match in a stem.
 * Three passes: exact match, starts-with (longest first), contains (3+ chars).
 * Also checks basis_720 roots for extended coverage.
 * Returns { root, meaning, source } where source is "engine" or "basis".
 */
function findRoot(stem) {
  const s = stem.toLowerCase();

  // 1. Exact match in engine roots
  if (ROOTS[s]) return { root: s, meaning: ROOTS[s], source: "engine" };

  // 2. Exact match in basis_720 roots
  if (BASIS_ROOTS[s]) return { root: s, meaning: s, source: "basis" };

  // 3. Starts-with match in engine roots (longest first)
  for (const root of ROOTS_SORTED) {
    if (s.startsWith(root) && root.length >= 2) {
      return { root, meaning: ROOTS[root], source: "engine" };
    }
  }

  // 4. Starts-with match in basis_720 roots (longest first)
  const basisSorted = Object.keys(BASIS_ROOTS).sort((a,b) => b.length - a.length);
  for (const root of basisSorted) {
    if (s.startsWith(root) && root.length >= 2) {
      return { root, meaning: root, source: "basis" };
    }
  }

  // 5. Contains match in engine roots (3+ chars, longest first)
  for (const root of ROOTS_SORTED) {
    if (root.length >= 3 && s.includes(root)) {
      return { root, meaning: ROOTS[root], source: "engine" };
    }
  }

  // 6. The stem itself is the root (unknown)
  return { root: s, meaning: "", source: "unknown" };
}

/**
 * Get jurisdiction for a morpheme, using basis_720 data.
 * Returns "land", "sea", "air", or null.
 */
function getJurisdiction(morpheme) {
  // Check basis_720 roots
  if (BASIS_ROOTS[morpheme]) {
    const j = BASIS_ROOTS[morpheme].jurisdiction;
    if (j === "land/soil") return "land";
    if (j === "sea/water") return "sea";
    if (j === "air/ether") return "air";
  }
  return null;
}

/**
 * ALGORITHMIC DECOMPOSITION (Tier 3)
 *
 * Mirrors decompose() from morpheme_negation.py:
 *   1. Find prefix (longest match first)
 *   2. Find suffix from remainder
 *   3. Find root in the stem between prefix and suffix
 *   4. Check VCC negation
 *   5. Build true meaning from parts
 */
function decomposeAlgorithmic(word) {
  const w = word.toLowerCase().trim();

  // Step 1: prefix
  let prefix = "", prefixMeaning = "", remainder = w;
  const pfxResult = findPrefix(w);
  if (pfxResult) {
    prefix = pfxResult.prefix;
    prefixMeaning = pfxResult.meaning;
    remainder = pfxResult.remainder;
  }

  // Step 2: suffix from remainder
  const sfxResult = findSuffix(remainder);
  const stem = sfxResult.stem;
  const suffix = sfxResult.suffix;
  const suffixMeaning = sfxResult.meaning;

  // Step 3: root from stem
  const rootResult = findRoot(stem);
  const root = rootResult.root;
  const rootMeaning = rootResult.meaning;
  const rootSource = rootResult.source;

  // Step 4: VCC negation
  const isNegated = prefix in VCC_NEGATION_PREFIXES;

  // Step 5: build true meaning
  const parts = [];
  if (prefixMeaning) parts.push(prefixMeaning.toUpperCase());
  if (rootMeaning)   parts.push(rootMeaning);
  else               parts.push(root);
  if (suffixMeaning) parts.push("(" + suffixMeaning + ")");
  const trueMeaning = parts.join(" + ");

  // Step 6: determine jurisdiction from root
  const rootJurisdiction = getJurisdiction(root) || getJurisdiction(stem);
  const prefixJurisdiction = getJurisdiction(prefix);
  const suffixJurisdiction = getJurisdiction(suffix);

  return {
    word: w,
    prefix, prefixMeaning,
    root, rootMeaning,
    suffix, suffixMeaning,
    isNegated,
    trueMeaning,
    apparentMeaning: "",
    source: rootSource === "basis" ? "basis" : "engine",
    rootJurisdiction,
    prefixJurisdiction,
    suffixJurisdiction,
  };
}


// ---------------------------------------------------------------------------
// MASTER DECOMPOSE — three tiers
// ---------------------------------------------------------------------------

/**
 * Decompose a word using the best available source:
 *   Tier 1: curated (decompositions.json) — gold standard
 *   Tier 2: basis_720 root match — grammar-verified
 *   Tier 3: algorithmic engine — live parse
 *
 * Returns a normalized result object for rendering.
 */
function decompose(word) {
  const w = word.toLowerCase().trim();
  if (!w) return null;

  // --- TIER 1: Curated ---
  if (CURATED[w]) {
    const c = CURATED[w];
    return {
      word: w,
      source: "curated",
      prefix: c.prefix || "",
      prefixMeaning: c.prefix_meaning || "",
      root: c.root || w,
      rootMeaning: c.root_meaning || "",
      suffix: c.suffix || "",
      suffixMeaning: c.suffix_meaning || "",
      isNegated: c.is_negated || false,
      trueMeaning: c.true_meaning || "",
      apparentMeaning: c.apparent_meaning || "",
      rootJurisdiction: null,
      prefixJurisdiction: null,
      suffixJurisdiction: null,
    };
  }

  // --- TIER 2 + 3: Algorithmic (uses basis_720 roots when available) ---
  return decomposeAlgorithmic(w);
}

async function loadData() {
  try {
    const [decompRes, basisRes] = await Promise.all([
      fetch('/data/decompositions.json'),
      fetch('/data/basis_720.json'),
    ]);

    if (decompRes.ok) {
      const decomps = await decompRes.json();
      decomps.forEach(d => { CURATED[d.word] = d; });
    }

    if (basisRes.ok) {
      const basis = await basisRes.json();
      basis.forEach(entry => {
        const r = entry.root;
        if (!BASIS_ROOTS[r]) {
          BASIS_ROOTS[r] = {
            jurisdiction: entry.jurisdiction,
            role: entry.role,
            negated: entry.negated,
            words: [],
          };
        }
        BASIS_ROOTS[r].words.push(entry.word);
      });
    }
  } catch (e) {
    // Data files not available (e.g. local file:// or path issue).
    // Engine still works — just without tier 1 and tier 2 enrichment.
  }
}

    html += `<div class="doc-item"><span class="doc-icon">${icon}</span> ${doc}</div>`;
  });
  html += '</div>';

  // VCC analysis
  const hasVCC = parts.some(p => p.vcc);

  if (hasVCC) {

    html += `

      <div class="vcc-rule">Prefix "<span class="highlight">${vccPart.text}</span>" follows the Vowel-Consonant-Consonant pattern</div>

function renderAlgorithmic(result) {
  // Render the algorithmic decomposition result
  let html = '<div class="morpheme-display">';

  let cardIndex = 0;

  // Prefix card
  if (result.prefix) {
    html += `
      <div class="morpheme-card prefix" style="animation-delay:${cardIndex * 0.15}s">
        <div class="morpheme-role">PREFIX</div>
        <div class="morpheme-text">${result.prefix.toUpperCase()}</div>
        <div class="morpheme-meaning">${result.prefixMeaning}</div>
        <div class="morpheme-origin">from prefix dictionary</div>
        ${result.isNegated ? '<div class="negation-badge">VCC NEGATION</div>' : ''}
        ${result.prefixJurisdiction ? jurisdictionBadge(result.prefixJurisdiction) : ''}
      </div>
    `;
    cardIndex++;
  }

  // Root card
  if (cardIndex > 0) html += '<div class="separator">|</div>';
  html += `
    <div class="morpheme-card root" style="animation-delay:${cardIndex * 0.15}s">
      <div class="morpheme-role">ROOT</div>
      <div class="morpheme-text">${result.root.toUpperCase()}</div>
      <div class="morpheme-meaning">${result.rootMeaning || '(base form)'}</div>
      <div class="morpheme-origin">${result.rootMeaning ? 'from root dictionary' : 'unmatched root — Germanic/native origin'}</div>
      ${result.rootJurisdiction ? jurisdictionBadge(result.rootJurisdiction) : ''}
    </div>
  `;
  cardIndex++;

  // Suffix card
  if (result.suffix) {
    html += '<div class="separator">|</div>';
    html += `
      <div class="morpheme-card suffix" style="animation-delay:${cardIndex * 0.15}s">
        <div class="morpheme-role">SUFFIX</div>
        <div class="morpheme-text">${result.suffix.toUpperCase()}</div>
        <div class="morpheme-meaning">${result.suffixMeaning}</div>
        <div class="morpheme-origin">from suffix dictionary</div>
        ${result.suffixJurisdiction ? jurisdictionBadge(result.suffixJurisdiction) : ''}
      </div>
    `;
  }

  html += '</div>';

  // Source badge
  const sourceLabel = result.source === "curated" ? "CURATED ENTRY" :
                      result.source === "basis"   ? "BASIS 720 ROOT MATCH" :
                                                     "LIVE ENGINE PARSE";
  const sourceClass = result.source === "curated" ? "source-curated" :
                      result.source === "basis"   ? "source-basis" :
                                                     "source-engine";
  html += `<div style="text-align:center;margin-bottom:10px"><span class="source-badge ${sourceClass}">${sourceLabel}</span></div>`;

  // True meaning
  if (result.trueMeaning) {
    html += `
      <div class="true-meaning">
        <div class="true-meaning-label">Morphological meaning</div>
        <div class="true-meaning-text">${result.trueMeaning}</div>
      </div>
    `;
  }

  // If curated, show vs assumed meaning
  if (result.apparentMeaning) {
    html += `
      <div class="vs-meaning">
        <div class="vs-card true-card">
          <div class="vs-label">What it actually says</div>
          <div class="vs-text-true">${result.trueMeaning}</div>
        </div>
        <div class="vs-divider">vs</div>
        <div class="vs-card assumed-card">
          <div class="vs-label">Common assumption</div>
          <div class="vs-text-assumed">${result.apparentMeaning}</div>
        </div>
      </div>
    `;
  }

  // VCC analysis panel
  html += '<div class="side-panel"><div class="vcc-panel" style="grid-column:1/-1"><h3>VCC Negation Analysis</h3>';
  if (result.isNegated) {
    html += `
      <div class="vcc-rule"><span class="highlight">NEGATION DETECTED</span></div>
      <div class="vcc-rule">Prefix "<span class="highlight">${result.prefix.toUpperCase()}</span>" is a VCC negation operator</div>
      <div class="vcc-rule">This prefix <span class="highlight">INVERTS</span> the meaning of the root "${result.root.toUpperCase()}"</div>
      <div class="vcc-rule">Parse: <span class="gold">${result.trueMeaning}</span></div>
    `;
  } else {
    html += `
      <div class="vcc-rule"><span class="gold">NO VCC NEGATION</span></div>
      <div class="vcc-rule">This word does not begin with a VCC negation prefix</div>
      <div class="vcc-rule">Meaning derived through <span class="gold">direct morpheme decomposition</span></div>
      <div class="vcc-rule">Parse: <span class="gold">${result.trueMeaning}</span></div>
    `;
  }
  html += '</div></div>';

  return html;
}


function jurisdictionBadge(jur) {
  if (jur === 'land') return '<div class="jurisdiction-badge jur-land">LAND / SOIL</div>';
  if (jur === 'sea')  return '<div class="jurisdiction-badge jur-sea">SEA / WATER</div>';
  if (jur === 'air')  return '<div class="jurisdiction-badge jur-air">AIR / ETHER</div>';
  return '';
}


function handleWord(word) {
  const w = word.toLowerCase().trim();
  if (!w) {
    document.getElementById('decompArea').innerHTML = '<div class="empty-state">Enter a word above to decompose it into its true morphological components</div>';
    return;
  }

  // Check for curated rich display first
  if (CURATED_DISPLAY[w]) {
    document.getElementById('decompArea').innerHTML = renderCuratedDisplay(w, CURATED_DISPLAY[w]);
    return;
  }

  // Run decomposition engine
  const result = decompose(w);
  if (!result) {
    document.getElementById('decompArea').innerHTML = '<div class="empty-state">Enter a word above to decompose it into its true morphological components</div>';
    return;
  }

  document.getElementById('decompArea').innerHTML = renderAlgorithmic(result);
}


// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------

// Build quick-word buttons
const qwContainer = document.getElementById('quickWords');
quickWords.forEach(w => {
  const btn = document.createElement('button');
  btn.className = 'qw-btn';
  btn.textContent = w;
  btn.addEventListener('click', () => {
    document.getElementById('wordInput').value = w;
    handleWord(w);
  });
  qwContainer.appendChild(btn);
});

// Input handler
const input = document.getElementById('wordInput');
input.addEventListener('input', () => handleWord(input.value));

// Load data files and start with default word
loadData().then(() => {
  handleWord('insurance');
  input.value = 'insurance';
});
</script>
