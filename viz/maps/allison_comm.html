function setupCanvas(id){
  const c=document.getElementById(id);
  const dpr=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  return [ctx,r.width,r.height];
}

// Daily volume
(function(){
  const[ctx,W,H]=setupCanvas('dailyChart');
  const pad={l:40,r:10,t:10,b:30};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const maxV=Math.max(...DAYS.map(d=>d.joel+d.allison));
  const bw=pw/DAYS.length;
  
  DAYS.forEach((d,i)=>{
    const x=pad.l+i*bw;
    const hJ=(d.joel/maxV)*ph;
    const hA=(d.allison/maxV)*ph;
    ctx.fillStyle='#1a4a7a';
    ctx.fillRect(x,pad.t+ph-hJ-hA,bw-1,hA);
    ctx.fillStyle='#c0a060';
    ctx.fillRect(x,pad.t+ph-hJ,bw-1,hJ);
  });
  
  // Month labels
  ctx.fillStyle='#555';ctx.font='9px JetBrains Mono';ctx.textAlign='center';
  let lastMonth='';
  DAYS.forEach((d,i)=>{
    const m=d.date.slice(0,7);
    if(m!==lastMonth){ctx.fillText(m,pad.l+i*bw,H-8);lastMonth=m;}
  });
  
  // Legend
  ctx.fillStyle='#c0a060';ctx.fillRect(W-160,8,10,10);
  ctx.fillStyle='#999';ctx.font='9px JetBrains Mono';ctx.textAlign='left';
  ctx.fillText('Joel',W-146,17);
  ctx.fillStyle='#1a4a7a';ctx.fillRect(W-100,8,10,10);
  ctx.fillStyle='#999';ctx.fillText('Allison',W-86,17);
})();

// Hourly pattern
(function(){
  const[ctx,W,H]=setupCanvas('hourChart');
  const hours={"0": 671, "1": 346, "2": 226, "3": 80, "4": 55, "5": 15, "6": 3, "7": 29, "8": 109, "9": 115, "10": 283, "11": 369, "12": 232, "13": 384, "14": 413, "15": 480, "16": 548, "17": 524, "18": 437, "19": 564, "20": 523, "21": 546, "22": 725, "23": 914};
  const maxH=Math.max(...Object.values(hours));
  const pad={l:30,r:10,t:10,b:25};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const bw=pw/24;
  
  for(let h=0;h<24;h++){
    const v=hours[h]||0;
    const bh=(v/maxH)*ph;
    const intensity=v/maxH;
    ctx.fillStyle=`rgba(192,160,96,${0.3+intensity*0.7})`;
    ctx.fillRect(pad.l+h*bw,pad.t+ph-bh,bw-2,bh);
    ctx.fillStyle='#555';ctx.font='8px JetBrains Mono';ctx.textAlign='center';
    ctx.fillText(h+':00',pad.l+h*bw+bw/2,H-8);
  }
})();

// Topic flow
(function(){
  const[ctx,W,H]=setupCanvas('topicChart');
  const colors={personal:'#c0a060',math:'#4488cc',scrolls:'#44aa44',legal:'#cc4444',work:'#aa44cc'};
  const pad={l:10,r:10,t:10,b:25};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const bw=pw/TOPICS.length;
  
  ['personal','math','scrolls','legal','work'].forEach((topic,ti)=>{
    ctx.strokeStyle=colors[topic];ctx.lineWidth=1.5;ctx.globalAlpha=0.8;
    ctx.beginPath();
    let maxV=Math.max(...TOPICS.map(d=>d[topic]||0));
    if(maxV===0)maxV=1;
    TOPICS.forEach((d,i)=>{
      const x=pad.l+i*bw;
      const y=pad.t+ph-(((d[topic]||0)/maxV)*ph*0.8);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=colors[topic];ctx.font='8px JetBrains Mono';
    ctx.fillText(topic,pad.l+ti*65,H-8);
  });
})();

// Cumulative words
(function(){
  const[ctx,W,H]=setupCanvas('cumChart');
  const pad={l:50,r:10,t:10,b:25};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  
  let cumJ=0,cumA=0;
  const maxW=98877;
  
  ctx.strokeStyle='#c0a060';ctx.lineWidth=2;ctx.beginPath();
  DAYS.forEach((d,i)=>{
    cumJ+=d.joel_words;
    const x=pad.l+(i/DAYS.length)*pw;
    const y=pad.t+ph-((cumJ/maxW)*ph);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });ctx.stroke();
  
  cumA=0;
  ctx.strokeStyle='#1a4a7a';ctx.lineWidth=2;ctx.beginPath();
  DAYS.forEach((d,i)=>{
    cumA+=d.allison_words;
    const x=pad.l+(i/DAYS.length)*pw;
    const y=pad.t+ph-((cumA/maxW)*ph);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });ctx.stroke();
  
  ctx.fillStyle='#c0a060';ctx.font='9px JetBrains Mono';ctx.textAlign='left';
  ctx.fillText('Joel: 41,986 words',pad.l+10,pad.t+20);
  ctx.fillStyle='#1a4a7a';
  ctx.fillText('Allison: 56,891 words',pad.l+10,pad.t+35);
})();
