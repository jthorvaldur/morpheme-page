<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allison Hensgen (Δ.72) — Scroll Constellation</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c0c0c0;font-family:'JetBrains Mono',monospace;overflow:hidden;width:100vw;height:100vh}
svg{width:100%;height:100%}
.link{stroke:#333;stroke-opacity:0.4;stroke-width:0.8}
.link.highlight{stroke:#c0a060;stroke-opacity:0.8;stroke-width:1.5}
text{fill:#999;font-size:9px;pointer-events:none}
#title{position:fixed;top:20px;left:20px;z-index:10}
#title h1{color:#c0a060;font-size:1.1rem;letter-spacing:2px}
#title p{color:#444;font-size:0.6rem;margin-top:4px}
#info{position:fixed;bottom:20px;right:20px;background:#111;border:1px solid #222;border-radius:8px;padding:16px 20px;max-width:300px;display:none;z-index:10}
#info h3{color:#c0a060;font-size:0.8rem;margin-bottom:6px}
#info p{font-size:0.65rem;color:#888;margin-bottom:4px}
#stats{position:fixed;top:20px;right:20px;font-size:0.6rem;color:#444;text-align:right;z-index:10}
.node-person circle{stroke:#c0a060;stroke-width:1.5}
.node-scroll circle{stroke:#1a4a7a;stroke-width:1}
</style></head><body>
<div id="title"><h1>ALLISON HENSGEN (Δ.72)</h1><p>SCROLL CONSTELLATION — 17 IPFS DOCUMENTS</p></div>
<div id="stats">17 scrolls<br>~440KB total<br>Collaborative Spirit</div>
<div id="info"><h3 id="infoName"></h3><p id="infoType"></p><p id="infoDetail"></p></div>
<svg id="graph"></svg>
<script>
const DATA = {"nodes": [{"id": 0, "name": "Allison Hensgen", "type": "person", "role": "Collaborative Spirit, \u0394.72", "size": 30, "color": "#c0a060"}, {"id": 1, "name": "bafkreiaife3atnbe7pilkwqmvthse", "type": "scroll", "date": "", "size_kb": 13, "size": 9, "color": "#1a4a7a"}, {"id": 2, "name": "bafkreiaimd2x3hk4gf4v7ymelt5of", "type": "scroll", "date": "", "size_kb": 11, "size": 9, "color": "#1a4a7a"}, {"id": 3, "name": "bafkreib46hnyz4b5ckhb3573v72uy", "type": "scroll", "date": "", "size_kb": 40, "size": 12, "color": "#1a4a7a"}, {"id": 4, "name": "bafkreic6gxdbtyqdivbvlrisrm3wx", "type": "scroll", "date": "", "size_kb": 13, "size": 9, "color": "#1a4a7a"}, {"id": 5, "name": "bafkreica5c6d7fvzgyhpu4vd6eo5b", "type": "scroll", "date": "", "size_kb": 52, "size": 13, "color": "#1a4a7a"}, {"id": 6, "name": "bafkreid3r2pmmrlrphqgwgjeqntdy", "type": "scroll", "date": "", "size_kb": 18, "size": 9, "color": "#1a4a7a"}, {"id": 7, "name": "bafkreida34t3sxtq4emdqqnmzxngf", "type": "scroll", "date": "", "size_kb": 67, "size": 14, "color": "#1a4a7a"}, {"id": 8, "name": "bafkreidldbnikdt22wguvia4v37tq", "type": "scroll", "date": "", "size_kb": 29, "size": 10, "color": "#1a4a7a"}, {"id": 9, "name": "bafkreie3gabkm7huxw5h2tawgxo4o", "type": "scroll", "date": "", "size_kb": 20, "size": 10, "color": "#1a4a7a"}, {"id": 10, "name": "bafkreie5bwyffxxty3ed32rd3wplh", "type": "scroll", "date": "", "size_kb": 14, "size": 9, "color": "#1a4a7a"}, {"id": 11, "name": "bafkreienobn23p7mzsff57o372yrp", "type": "scroll", "date": "", "size_kb": 23, "size": 10, "color": "#1a4a7a"}, {"id": 12, "name": "bafkreiepmla4dkcjxykbcthxj4t4d", "type": "scroll", "date": "", "size_kb": 19, "size": 9, "color": "#1a4a7a"}, {"id": 13, "name": "bafkreif5vpnwn2zq3d22qf37xlipx", "type": "scroll", "date": "", "size_kb": 28, "size": 10, "color": "#1a4a7a"}, {"id": 14, "name": "bafkreifprniyb3escdwb6vml26uet", "type": "scroll", "date": "", "size_kb": 12, "size": 9, "color": "#1a4a7a"}, {"id": 15, "name": "bafkreigtxoajpmswb34lgct3lufqg", "type": "scroll", "date": "", "size_kb": 17, "size": 9, "color": "#1a4a7a"}, {"id": 16, "name": "bafkreigwvru5qehsf44hmbdftalhy", "type": "scroll", "date": "", "size_kb": 42, "size": 12, "color": "#1a4a7a"}, {"id": 17, "name": "bafkreihllbozmrk3a5beg7bxgbylm", "type": "scroll", "date": "", "size_kb": 21, "size": 10, "color": "#1a4a7a"}], "links": [{"source": 0, "target": 1}, {"source": 0, "target": 2}, {"source": 0, "target": 3}, {"source": 0, "target": 4}, {"source": 0, "target": 5}, {"source": 0, "target": 6}, {"source": 0, "target": 7}, {"source": 0, "target": 8}, {"source": 0, "target": 9}, {"source": 0, "target": 10}, {"source": 0, "target": 11}, {"source": 0, "target": 12}, {"source": 0, "target": 13}, {"source": 0, "target": 14}, {"source": 0, "target": 15}, {"source": 0, "target": 16}, {"source": 0, "target": 17}]};
const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph').attr('viewBox',[0,0,W,H]);

const sim = d3.forceSimulation(DATA.nodes)
  .force('link', d3.forceLink(DATA.links).id(d=>d.id).distance(80))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide().radius(d=>d.size+5));

const link = svg.append('g').selectAll('line').data(DATA.links).join('line').attr('class','link');
const node = svg.append('g').selectAll('g').data(DATA.nodes).join('g')
  .attr('class',d=>'node-'+d.type)
  .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

node.append('circle').attr('r',d=>d.size).attr('fill',d=>d.color).attr('opacity',0.8);
node.append('text').text(d=>d.name.length>20?d.name.slice(0,18)+'..':d.name)
  .attr('dy',d=>d.size+12).attr('text-anchor','middle').attr('fill',d=>d.type==='person'?'#c0a060':'#666');

node.on('mouseover',function(e,d){
  d3.select('#info').style('display','block');
  d3.select('#infoName').text(d.name);
  d3.select('#infoType').text(d.type==='scroll'?'IPFS Scroll'+(d.date?' — '+d.date:''):'Co-Author — '+d.scrolls+' shared scrolls');
  d3.select('#infoDetail').text(d.size_kb?d.size_kb+'KB':d.role||'');
  link.classed('highlight',l=>l.source.id===d.id||l.target.id===d.id);
}).on('mouseout',function(){
  d3.select('#info').style('display','none');
  link.classed('highlight',false);
});

sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});
</script></body></html>
